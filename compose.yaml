services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bd_revendedoracarros
      MYSQL_USER: revendedora
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no arquivo .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
  php:
    build: ./api-revendedora
    ports: ["127.0.0.1:8080:80"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: bd_revendedoracarros
      DB_USER: revendedora
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - php-sessions:/var/lib/php/sessions
volumes:
  mysql-data:
  php-sessions:
